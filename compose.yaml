services:
  visitpng:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3001}:3000"
    environment:
      NODE_ENV: production
      DATABASE_PATH: /app/data/visitpng.db
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
    volumes:
      - visitpng_data:/app/data
volumes:
  visitpng_data:

